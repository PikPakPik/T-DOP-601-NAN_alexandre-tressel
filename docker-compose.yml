version: "3.4"
services:
  redis:
    image: redis:alpine
    restart: always
    environment:
      ALLOW_EMPTY_PASSWORD: yes
    ports:
      - "6379:6379"
    networks:
      - poll-tier
      - back-tier

  db:
    image: postgres:alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - result-tier
      - back-tier

  poll:
    build: ./poll
    restart: always
    depends_on:
      - redis
    environment:
      REDIS: redis
      DB: db
    ports:
      - "5000:80"
    networks:
      - poll-tier

  worker:
    build: ./worker
    restart: always
    depends_on:
      - db
      - redis
    environment:
      REDIS: redis
      DB: db
    networks:
      - back-tier

  result:
    build: ./result
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "5001:80"
    networks:
      - result-tier

volumes:
  db-data:

networks:
  poll-tier:
  result-tier:
  back-tier:
